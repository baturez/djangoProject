{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bartini - Kayıt Ol</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'sign.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="{% static 'images/logo.png' %}" alt="Bartini Logo" style="width: 150px;">
            </a>
        </div>
    </nav>

    <!-- Signup Section -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%; border-radius: 12px;">
            <h2 class="text-center mb-4" style="color: #333; font-weight: bold;">Kayıt Ol</h2>

            <!-- Success Message -->
            {% if success_message %}
            <div class="alert alert-success" role="alert" id="successMessage">
                {{ success_message }}
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    setTimeout(() => window.location.href = '/', 1500); /* 1.5 saniye sonra yönlendirme */
                });
            </script>
            {% endif %}

            <!-- Error Message -->
            {% if error_message %}
            <div class="alert alert-danger" role="alert" id="errorMessage">
                {{ error_message }}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'register' %}" autocomplete="off">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">E-posta</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="E-posta" required>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">Kullanıcı Adı</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Kullanıcı Adı" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Şifre</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Şifre" required>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="termsCheckbox" required>
                    <label class="form-check-label" for="termsCheckbox">
                        Bartini anonimlik ilkesine uygun bir platformdur. Ancak, herhangi bir hakaret, tehdit veya yasa dışı içerik paylaşımı durumunda anonimlik ifşa edilebilir. 
                        <a href="/privacy-policy" target="_blank">Gizlilik ve Kullanım Koşulları</a>'nı okudum ve kabul ediyorum.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Hesabımı Oluştur</button>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none" style="color: #007bff;">Zaten hesabım var</a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
