{% load static %}

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-posta Doğrulama</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    
</head>
<body style="font-family: Arial, sans-serif; color: #333; background-color: #f4f4f4; margin: 0; padding: 0;">
    <div style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
        <div style="text-align: center; margin-bottom: 20px;">
            <h1 style="color: #4CAF50; font-size: 24px; margin: 0;">Hesap Doğrulama</h1>
        </div>
        <div style="font-size: 16px; line-height: 1.5;">
            <p>Merhaba {{ username }},</p>
            <p>Hesabınızı doğrulamak için aşağıdaki bağlantıyı tıklayın:</p>
            <a href="{{ verification_link }}" style="display: inline-block; padding: 12px 20px; background-color: #4CAF50; color: #ffffff; text-decoration: none; border-radius: 4px; font-size: 16px; margin-top: 20px;">Hesabımı Doğrula</a>
        </div>
        <div style="margin-top: 30px; text-align: center; font-size: 14px; color: #777;">
            <p>Eğer bu isteği siz yapmadıysanız, bu e-postayı görmezden gelebilirsiniz.</p>
            <p>Bartini</p>
        </div>
    </div>
</body>
</html>
