{% extends 'base.html' %}
{% load static %}

{% block title %}Grup Odaları{% endblock %}
{% load custom_filters %}
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">

{% block content %}
    <link rel="stylesheet" href="{% static 'chat-room.css' %}">
    <link rel="stylesheet" href="{% static 'home.css' %}">

<h1>Chat Rooms</h1>

<!-- Chat Room Sekmeleri -->
<div class="d-flex">
    <div id="room-list" class="list-group" style="width: 20%;">
        {% for i in rooms %}
            <button class="list-group-item list-group-item-action" onclick="openRoom('room{{ i }}')">
                Chat Room {{ i }}
            </button>
        {% endfor %}
    </div>

    <!-- Chat Room İçerik Alanı -->
    <div id="room-content" style="width: 80%; padding: 10px; border: 1px solid #ccc; margin-left: 20px;">
        {% for i in rooms %}
        <div id="room{{ i }}" class="chat-room" style="display: none;">
            <h3>Chat Room {{ i }}</h3>
            <div id="chat-log-room{{ i }}" style="border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto;"></div>
            <div id="sending-indicator-room{{ i }}" class="sending-indicator" style="display: none;">
                <span>Gönderiliyor...</span>
            </div>
            <input id="chat-message-input-room{{ i }}" type="text" placeholder="Type your message...">
            <button class="btn btn-primary .button-chat" onclick="sendMessageRoom('room{{ i }}')">Send</button>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    const chatSockets = {};

    function openRoom(roomName) {
        const chatRooms = document.getElementsByClassName('chat-room');
        for (const room of chatRooms) {
            room.style.display = 'none';
        }

        document.getElementById(roomName).style.display = 'block';

        if (!chatSockets[roomName]) {
            const chatSocket = new WebSocket(
                'ws://' + window.location.host + '/ws/chat_room/' + roomName + '/'
            );

            chatSockets[roomName] = chatSocket;

            chatSocket.onmessage = function (e) {
                const data = JSON.parse(e.data);
                const chatLog = document.getElementById('chat-log-' + roomName);

                const messageElement = document.createElement('p');
                const senderElement = document.createElement('span');
                senderElement.textContent = data.sender + ': ';
                senderElement.classList.add('sender');  

                const messageContent = document.createElement('span');
                messageContent.textContent = data.message;

                messageElement.appendChild(senderElement);
                messageElement.appendChild(messageContent);

                chatLog.appendChild(messageElement);
                chatLog.scrollTop = chatLog.scrollHeight;
            };

            chatSocket.onclose = function (e) {
                console.error('Chat socket closed unexpectedly');
            };
        }
    }

    function sendMessageRoom(roomName) {
    const messageInputDom = document.getElementById('chat-message-input-' + roomName);
    const message = messageInputDom.value;
    const username = '{{ username }}';  

    const sendingIndicator = document.getElementById('sending-indicator-' + roomName);
    
    sendingIndicator.style.display = 'block';

    setTimeout(() => {
        if (chatSockets[roomName]) {
            chatSockets[roomName].send(JSON.stringify({
                'message': message,
                'sender': username
            }));
        }

        messageInputDom.value = '';

        sendingIndicator.style.display = 'none';
    }, 1500); 
}
    document.querySelectorAll('input[type="text"]').forEach(input => {
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            const roomName = this.id.replace('chat-message-input-', '');
            sendMessageRoom(roomName);
            e.preventDefault();  
        }
    });
});
</script>
{% endblock %}
