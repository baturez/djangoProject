{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <title>Bartini - Giriş</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="{% static 'script.js' %}"></script>
</head>
<body>
    <nav class="navbar bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img style="width: 275px;" src="{% static 'images/logo.png' %}" alt="Bartini Logo">
            </a>
        </div>
    </nav>

    <div class="container-fluid d-flex justify-content-center align-items-center a">
        <div class="row w-100">
            <!-- Sol Kısım: Background ve Hesap Oluşturun -->
            <div class="col-md-6 background-section" style="padding-left: 0px; " >
                <div class="container center background-overlay"style="padding-left: 10px" >
                    <div class="left-section">
                        <button class="inputs" onclick="window.location.href='/signup';">Hesap Oluşturun</button>
                    </div>
                </div>
            </div>
            <!-- Sağ Kısım: Login Formu -->
            <div class="col-md-6">
                <div class="right-section center text-center">
                    <div class="container center">
                        <form class="login-form" method="POST" action="{% url 'login' %}">
                            {% csrf_token %}
                            <div class="input-group">
                                <input type="text" id="username" name="username" class="input-field" placeholder=" " required>
                                <label for="username" class="input-label">Kullanıcı Adı</label>
                            </div>
                            <div class="input-group">
                                <input type="password" id="password" name="password" class="input-field" placeholder=" " required>
                                <label for="password" class="input-label">Şifre</label>
                            </div>
                            <button type="submit" class="login-button">Giriş Yap</button>

                            {% if error_message %}
                            <div class="alert alert-danger mt-2" role="alert">
                                {{ error_message }}
                            </div>
                            {% endif %}
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
